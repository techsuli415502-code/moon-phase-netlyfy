<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="moonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf7f0"/>
    </radialGradient>
    <mask id="crescentMask2">
      <circle cx="32" cy="32" r="16" fill="white"/>
      <circle cx="39" cy="27" r="13" fill="black"/>
    </mask>
    <filter id="moonGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Logo badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad2)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#borderGrad2)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="18" fill="#f59e0b" opacity="0.25" filter="url(#moonGlow2)"/>
  <rect x="0" y="0" width="64" height="64" fill="url(#moonGrad2)" mask="url(#crescentMask2)"/>
  <g fill="#f59e0b">
    <circle cx="13" cy="17" r="1.3"/>
    <circle cx="51" cy="15" r="1"/>
    <circle cx="53" cy="45" r="1.4"/>
    <circle cx="11" cy="49" r="1.1"/>
  </g>
  <g transform="translate(50 24)" fill="#f59e0b">
    <path d="M 0 -3.5 L 1 -1 L 3.5 0 L 1 1 L 0 3.5 L -1 1 L -3.5 0 L -1 -1 Z"/>
  </g>

  <!-- Brand text -->
  <text x="80" y="38" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#textGrad)">Moon Phase Emoji</text>
</svg>
